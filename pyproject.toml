[tool.poetry]
name = "hue2mqtt"
version = "0.4.2"
description = "Python Hue to MQTT Bridge"
authors = ["Dan Trickey <contact@trickey.io>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/trickeydan/hue2mqtt-python"
homepage = "https://github.com/trickeydan/hue2mqtt-python"
documentation = "https://github.com/trickeydan/hue2mqtt-python"
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = "^3.11"
aiomqtt = "^2.5.1"
aiohue = "^4.8.1"
pydantic = "^2.0"
click = "^8.1.3"
aiohttp = "^3.9"

[tool.poetry.dev-dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "^0.21"

[tool.poetry.scripts]
hue2mqtt = 'hue2mqtt.app:app'

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.mypy]
warn_unused_ignores = true
warn_return_any = true

strict_optional = true
no_implicit_optional = true

disallow_subclassing_any = true
disallow_any_generics = true

disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["aiomqtt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiohue.*"]
ignore_missing_imports = true


[tool.ruff]
select = [
    "A",
    "ANN",
    "B",
    "BLE",
    "C4",
    "COM",
    "DJ",
    "DTZ",
    "E",
    "F",
    "FBT",
    "I",
    "N",
    "S",
    "T10",
    "UP",
    "W",
]
ignore = [
    "ANN101",  # Missing type annotation for `self` in method
    "ANN102",  # Missing type annotation for `cls` in classmethod
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "COM812",  # 
    "B009",    # Do not call `getattr` with a constant attribute value.
    "B027",    # an empty method in an abstract base class, but has no abstract decorator
    "FBT001",  # Boolean positional arg in function definition
    "N805",    # First argument of a method should be named `self`
    "S101",    # S101 Use of `assert` detected
]

target-version = "py311"
line-length = 90

[tool.pytest.ini_options]
asyncio_mode = "auto"